name: Probe Android build
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Baixar o codigo
        run: |
          git clone --depth 1 https://forge.a-lec.org/speed-dreams/speed-dreams-code.git sd
          cd sd
          git log -1 --format='%h %ad %s'
          ls
      - name: Configurar com o NDK
        run: |
          cd sd
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DOPTION_OFFICIAL_ONLY=ON 2>&1 | tee ../configure.log
      - name: Ultimas linhas do log
        if: always()
        run: tail -n 40 configure.log || true
