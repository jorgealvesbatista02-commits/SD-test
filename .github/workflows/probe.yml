# probe
 name: Probe Android build
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Baixar o codigo
        run: |
          git clone --depth 1 https://forge.a-lec.org/speed-dreams/speed-dreams-code.git sd
          cd sd
          git submodule update --init --depth 1 freesolid
          ls freesolid | head
      - name: Instalar bibliotecas (vcpkg)
        shell: bash
        run: |
          $VCPKG_INSTALLATION_ROOT/vcpkg install \
            sdl2 sdl2-mixer openal-soft enet libpng libjpeg-turbo curl expat \
            --triplet arm64-android 2>&1 | tee vcpkg.log
      - name: Configurar com o NDK
        shell: bash
        run: |
          cd sd
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
            -DVCPKG_TARGET_TRIPLET=arm64-android \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DOPTION_OFFICIAL_ONLY=ON \
            -DSD_ASSUME_DATADIR=1 \
            -DOPTION_OSGGRAPH=OFF 2>&1 | tee ../configure.log
      - name: Ultimas linhas dos logs
        if: always()
        shell: bash
        run: |
          tail -n 30 vcpkg.log || true
          echo ------
          tail -n 40 configure.log || true
